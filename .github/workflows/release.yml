name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: nfpm
          version: v2.47.0
          args: package --packager deb --target dist/
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: nfpm
          version: v2.47.0
          args: package --packager rpm --target dist/
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: nfpm
          version: v2.47.0
          args: package --packager apk --target dist/
      - name: Build portable archive
        run: tar -czf dist/bee-1.0.0.tar.gz bee README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

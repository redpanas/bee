name: Test packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test standalone script
        run: make test
      - name: Test Python package build
        run: |
          python -m pip install build
          python -m build
      - name: Test Ruby package build
        run: gem build bee-holy-scripture.gemspec
      - name: Test Rust package
        run: cargo test --locked
      - name: Test npm package contents
        run: npm pack --dry-run

name: bee
arch: all
platform: linux
version: 1.0.0
section: utils
priority: optional
maintainer: Panagiotis Kouzaris <37497515+redpanas@users.noreply.github.com>
description: The holy scripture downloader
homepage: https://github.com/redpanas/bee
license: MIT
depends:
  - curl
  - sed
contents:
  - src: ./bee
    dst: /usr/bin/bee
    file_info:
      mode: 0755
  - src: ./README.md
    dst: /usr/share/doc/bee/README.md
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/licenses/bee/LICENSE
    file_info:
      mode: 0644
